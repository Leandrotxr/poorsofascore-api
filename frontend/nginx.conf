server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Obs.: um add_header dentro de "location" ANULA os do nível "server";
    # por isso os cabeçalhos de segurança se repetem em cada bloco.

    # SPA: qualquer rota (/equipes/12, /partidas?...) devolve o index.html e o React Router assume.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Arquivos do build têm hash no nome: podem ficar em cache "para sempre".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
}
