name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, tipos, migrações, testes)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poorsofascore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Banco das migrações (alembic) e banco dos testes (pytest) ficam separados:
      # os testes criam e apagam as tabelas a cada caso.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/poorsofascore
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/poorsofascore_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Migrações aplicam do zero
        run: alembic upgrade head

      - name: Migrações batem com os models
        run: alembic check

      - name: Migrações revertem
        run: alembic downgrade base && alembic upgrade head

      - name: Criar banco de testes
        run: psql postgresql://postgres:postgres@localhost:5432/poorsofascore -c "CREATE DATABASE poorsofascore_test"

      - name: Testes (PostgreSQL) + cobertura
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Testes (SQLite)
        run: TEST_DATABASE_URL=sqlite:// pytest -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Front-end (tipos, lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: pip install -r ../requirements.txt

      # Se alguém mudou a API e esqueceu de rodar `npm run tipos:atualizar`, o CI acusa aqui.
      - name: Tipos do front batem com a API
        run: |
          npm run tipos:atualizar
          git diff --exit-code -- openapi.json src/api/schema.ts || {
            echo "::error::openapi.json/schema.ts desatualizados. Rode 'npm run tipos:atualizar' (em frontend/) e faça commit."
            exit 1
          }

      - name: ESLint
        run: npm run lint

      - name: Testes (Vitest)
        run: npm test

      - name: TypeScript + build
        run: npm run build
