# Configuração das ferramentas de qualidade (ruff, mypy, pytest, coverage).
# As dependências continuam em requirements.txt (produção) e requirements-dev.txt (desenvolvimento).

[project]
name = "poorsofascore-api"
version = "0.1.0"
requires-python = ">=3.12"

# ---------- Ruff: lint + formatação ----------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes (imports/variáveis não usados, nomes indefinidos)
    "I",       # ordenação de imports
    "UP",      # sintaxe moderna do Python
    "B",       # bugbear (armadilhas comuns)
    "SIM",     # simplificações
    "C4",      # comprehensions
    "RUF",     # regras do próprio ruff
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # caracteres "ambíguos" em textos em português (–, ’ etc.)
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"app/schemas/*" = ["RUF012"]  # Pydantic copia o default `[]` para cada instância: não é estado compartilhado

# ---------- Mypy: checagem de tipos ----------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false  # rotas do FastAPI ficam mais legíveis sem anotação de retorno

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]  # depreciação no NOSSO código quebra o teste

# ---------- Cobertura ----------
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:"]
